spring.application.name=checkmate-backend
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

groq.api.base-url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_MODEL:openai/gpt-oss-120b}

ml.service.base-url=${ML_SERVICE_URL:http://localhost:8000}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
